<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>פולשי הפיקסלים</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #39ff14; font-family: "Courier New", Consolas, monospace; overflow: hidden; }
  .wrap { position: relative; height: 100vh; display: flex; align-items: center; justify-content: center; }
  canvas { width: min(100vw, calc(100vh * 4 / 3)); image-rendering: pixelated; touch-action: none; border: 4px solid #39ff14; box-sizing: border-box; box-shadow: 0 0 24px rgba(57,255,20,.4); }
  /* פסי מסך של טלוויזיה ישנה */
  .wrap::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,.25) 0 2px, transparent 2px 4px); }
  #hud { position: absolute; top: 14px; right: 50%; transform: translateX(50%); font-size: 18px; font-weight: bold; letter-spacing: 1px; text-shadow: 0 0 6px #39ff14; white-space: nowrap; }
  #hud, #msg { pointer-events: none; }
  @media (max-width: 600px) { #hud { top: 60px; font-size: 15px; } }
  #msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; background: rgba(0,0,0,.85); border: 3px solid #ff2bd6; color: #ff2bd6; padding: 16px 20px; font-size: 20px; font-weight: bold; text-shadow: 0 0 6px #ff2bd6; max-width: calc(100vw - 48px); }
  #msg small { display: block; color: #fff; font-size: 14px; margin-top: 8px; text-shadow: none; font-weight: normal; }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="c" width="320" height="240"></canvas>
  <div id="hud"></div>
  <div id="msg"></div>
</div>
<script>
  // ===== הגדרות המשחק: המספרים שקובעים איך הוא מרגיש =====
  var CFG = {
    spawnRate: 1.3,   // כמה פולשים מופיעים בשנייה
    enemySpeed: 35,   // כמה מהר הם יורדים
    enemyHP: 3        // כמה פגיעות צריך כדי להפיל פולש
  };

  var c = document.getElementById("c"), ctx = c.getContext("2d");
  var W = 320, H = 240;
  ctx.imageSmoothingEnabled = false;

  // ציורי פיקסלים: כל שורה היא שורת פיקסלים, 1 = צבוע
  var INVADER = ["00100100", "00111100", "01011010", "11111111", "10111101", "10000001"];
  var SHIP = ["0001000", "0011100", "0111110", "1111111", "1101011"];
  function sprite(rows, x, y, color, px) {
    ctx.fillStyle = color;
    rows.forEach(function (r, j) { for (var i = 0; i < r.length; i++) if (r[i] === "1") ctx.fillRect(Math.round(x + i * px), Math.round(y + j * px), px, px); });
  }

  var stars = []; for (var s = 0; s < 50; s++) stars.push({ x: Math.random() * W, y: Math.random() * H, v: 10 + Math.random() * 30 });
  var state, time, score, lives, ship, bullets, enemies, spawnAcc, fireAcc, best = 0, keys = {};

  function reset() {
    time = 0; score = 0; lives = 3; spawnAcc = 0; fireAcc = 0;
    ship = { x: W / 2, y: H - 18 }; bullets = []; enemies = [];
  }
  function start() { reset(); state = "play"; showMsg(""); }

  addEventListener("keydown", function (e) {
    keys[e.code] = true;
    if (["ArrowLeft", "ArrowRight", "Space"].indexOf(e.code) >= 0) e.preventDefault();
    if (e.code === "Space" && state !== "play") start();
  });
  addEventListener("keyup", function (e) { keys[e.code] = false; });
  // מגע ועכבר: החללית הולכת אחרי האצבע
  function toX(e) { var r = c.getBoundingClientRect(); return (e.clientX - r.left) / r.width * W; }
  c.addEventListener("pointerdown", function (e) { if (state !== "play") start(); ship.x = toX(e); });
  c.addEventListener("pointermove", function (e) { if (e.buttons || e.pointerType === "touch") ship.x = toX(e); });

  function update(dt) {
    stars.forEach(function (s) { s.y += s.v * dt; if (s.y > H) { s.y = 0; s.x = Math.random() * W; } });
    if (state !== "play") return;
    time += dt;

    if (keys.ArrowLeft || keys.KeyA) ship.x -= 160 * dt;
    if (keys.ArrowRight || keys.KeyD) ship.x += 160 * dt;
    ship.x = Math.max(10, Math.min(W - 10, ship.x));

    // יורים לבד, 3 פעמים בשנייה
    fireAcc += dt;
    if (fireAcc > 0.3) { fireAcc = 0; bullets.push({ x: ship.x, y: ship.y - 8 }); }
    bullets.forEach(function (b) { b.y -= 240 * dt; });

    // פולשים חדשים, וקצת יותר עם הזמן
    spawnAcc += CFG.spawnRate * (1 + time / 40) * dt;
    while (spawnAcc >= 1) { spawnAcc--; enemies.push({ x: 12 + Math.random() * (W - 24), y: -12, hp: Math.max(1, Math.round(CFG.enemyHP)), hit: 0 }); }
    enemies.forEach(function (en) { en.y += CFG.enemySpeed * dt; en.hit = Math.max(0, en.hit - dt); });

    // פגיעות
    bullets.forEach(function (b) {
      enemies.forEach(function (en) {
        if (!b.dead && en.hp > 0 && Math.abs(b.x - en.x) < 9 && Math.abs(b.y - en.y) < 8) {
          b.dead = true; en.hp--; en.hit = 0.08; if (en.hp === 0) score += 10;
        }
      });
    });
    enemies.forEach(function (en) { if (en.hp > 0 && en.y > H - 6) { en.hp = 0; lives--; } });
    bullets = bullets.filter(function (b) { return !b.dead && b.y > -5; });
    enemies = enemies.filter(function (en) { return en.hp > 0; });

    if (enemies.length > 12 && window.labStuck) labStuck();
    if (lives <= 0) {
      state = "over"; best = Math.max(best, score);
      showMsg("GAME OVER · " + score, "רווח או הקשה כדי לנסות שוב");
      if (time > 6 && window.labStuck) labStuck();
    }
  }

  function draw() {
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#555"; stars.forEach(function (s) { ctx.fillRect(Math.round(s.x), Math.round(s.y), 1, 1); });
    if (state === "play" || state === "over") {
      enemies.forEach(function (en) { sprite(INVADER, en.x - 8, en.y - 6, en.hit ? "#fff" : (en.hp > 1 ? "#ff2bd6" : "#ffe14d"), 2); });
      ctx.fillStyle = "#fff"; bullets.forEach(function (b) { ctx.fillRect(Math.round(b.x), Math.round(b.y), 1, 4); });
      sprite(SHIP, ship.x - 7, ship.y - 5, "#39ff14", 2);
    }
    document.getElementById("hud").textContent = "ניקוד " + score + " · שיא " + best + " · " + "♥".repeat(Math.max(0, lives));
  }

  function showMsg(a, b) {
    var m = document.getElementById("msg");
    m.style.display = a ? "block" : "none";
    m.innerHTML = a + (b ? "<small>" + b + "</small>" : "");
  }

  var last = performance.now();
  function loop(now) { var dt = Math.min(0.033, (now - last) / 1000); last = now; update(dt); draw(); requestAnimationFrame(loop); }
  reset(); state = "ready";
  showMsg("👾 פולשי הפיקסלים", "חצים או גרירה = לזוז. היריות לבד. אל תתנו להם לנחות! רווח או הקשה כדי להתחיל");
  requestAnimationFrame(loop);
</script>
<!-- LAB:START -->
<script>
  var LAB = { sliders: [
    { key: "spawnRate", label: "👾 כמה פולשים בשנייה", min: 0.2, max: 4, step: 0.1 },
    { key: "enemySpeed", label: "⬇️ מהירות הנפילה", min: 10, max: 120, step: 5 },
    { key: "enemyHP", label: "🛡️ כמה פגיעות לפולש", min: 1, max: 6, step: 1 }
  ] };
</script>
<script src="lab.js"></script>
<!-- LAB:END -->
</body>
</html>
